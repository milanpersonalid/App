<svg viewBox="0 0 160 160" width="160" height="160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="foundryRoseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF5F2" />
      <stop offset="60%" stop-color="#FCE7E2" />
      <stop offset="100%" stop-color="#F7D1C7" />
    </radialGradient>
    <linearGradient id="crestRoseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8998D" />
      <stop offset="35%" stop-color="#F4C0B6" />
      <stop offset="70%" stop-color="#E07A5F" />
      <stop offset="100%" stop-color="#C86349" />
    </linearGradient>
    <linearGradient id="diamondSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#E8998D" />
      <stop offset="100%" stop-color="#E07A5F" />
    </linearGradient>
  </defs>

  <!-- Titanium Dark Android Rounded App Icon Container -->
  <rect width="160" height="160" rx="36" fill="#1E1E24" stroke="#3F3F46" stroke-width="2" />

  <!-- Background disc -->
  <circle cx="80" cy="82" r="62" fill="url(#foundryRoseGlow)" stroke="url(#crestRoseGold)" stroke-width="3" />
  
  <!-- Inner filigree border -->
  <circle cx="80" cy="82" r="55" stroke="#C86349" stroke-width="1" stroke-dasharray="2 3" opacity="0.7" />
  <ellipse cx="80" cy="88" rx="38" ry="44" stroke="url(#crestRoseGold)" stroke-width="2" />

  <!-- Diamond Ring Crest on Top -->
  <ellipse cx="80" cy="36" rx="12" ry="6" stroke="url(#crestRoseGold)" stroke-width="2.5" fill="none" />
  <polygon points="80,22 88,32 80,40 72,32" fill="url(#diamondSheen)" stroke="#ffffff" stroke-width="1" />
  <polygon points="80,22 84,32 80,38 76,32" fill="#ffffff" opacity="0.9" />

  <!-- Shreenathji Swaroop center silhouette with divine mukut & pearl adornments -->
  <ellipse cx="80" cy="92" rx="20" ry="22" fill="#292930" />
  
  <!-- Crown / Mukut in Rose Gold & Copper -->
  <path d="M 69 76 C 73 63, 87 63, 91 76 Z" fill="#C86349" stroke="#F4C0B6" stroke-width="1" />
  <path d="M 65 73 C 69 69, 75 71, 77 78 Z" fill="#1E1E24" />
  <circle cx="72" cy="73" r="2" fill="#A8556B" />
  
  <!-- Eyes & Tilak -->
  <ellipse cx="74" cy="88" rx="3.5" ry="1.8" fill="#ffffff" />
  <circle cx="75" cy="88" r="1" fill="#000000" />
  <ellipse cx="86" cy="88" rx="3.5" ry="1.8" fill="#ffffff" />
  <circle cx="85" cy="88" r="1" fill="#000000" />
  <line x1="80" y1="80" x2="80" y2="87" stroke="#A8556B" stroke-width="1.8" stroke-linecap="round" />

  <!-- Nose Ring (Nath) -->
  <circle cx="78" cy="92" r="1.8" fill="#ffffff" stroke="#E07A5F" stroke-width="0.8" />
  <circle cx="77" cy="92" r="0.7" fill="#A8556B" />

  <!-- Pearl Necklace (Haar) -->
  <path d="M 65 99 Q 80 110 95 99" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2.5 2.5" />
  <path d="M 67 104 Q 80 115 93 104" stroke="#F4C0B6" stroke-width="2" stroke-linecap="round" stroke-dasharray="2.5 2.5" />
  <rect x="77" y="108" width="6" height="6" fill="#A8556B" rx="1" stroke="#E07A5F" stroke-width="1" />

  <!-- Floral scroll side flourishes in Rose Gold -->
  <path d="M 36 82 Q 28 68 40 58 Q 44 71 36 82" fill="url(#crestRoseGold)" opacity="0.85" />
  <path d="M 124 82 Q 132 68 120 58 Q 116 71 124 82" fill="url(#crestRoseGold)" opacity="0.85" />
</svg>
